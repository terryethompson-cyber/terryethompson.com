name: Check site

# Runs on every change, so problems are caught before a customer finds them.
# The external-link check runs weekly instead, because it depends on other
# people's servers being up.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1' # Monday mornings, Eastern
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Also check links to other websites (slower, depends on their servers)'
        type: boolean
        default: false

jobs:
  pages:
    name: Links, pages and sharing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # These checks have no dependencies — plain Node, nothing to install.
      - name: Make sure the checker itself works
        run: npm run test:self

      - name: Check every link on the site
        run: npm run test:links

      - name: Check pages are shareable, findable and quick
        run: npm run test:pages

  buttons:
    name: Buttons and forms actually work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Get a browser
        run: npx playwright install --with-deps chromium

      - name: Drive the site like a customer would
        run: npm run test:browser

  external:
    name: External links
    # Weekly, or on request. Never on a push or pull request, so a slow
    # afternoon at someone else's server can't block a change to this site.
    if: github.event_name == 'schedule' || inputs.check_external
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check links pointing to other sites
        run: npm run test:external
